[build]
  publish = "."

# Canonical host is the non-www apex. Force any www request to redirect
# there so search engines and visitors never see both resolving.
[[redirects]]
  from = "https://www.shilohspecialtyroofing.com/*"
  to = "https://shilohspecialtyroofing.com/:splat"
  status = 301
  force = true

# Specialty Materials -> Specialty Roofing, and Roof Replacement -> Asphalt
# Roofing (page rename). Cover both the clean slug and the .html path in
# case anything bookmarked or linked the old URL either way.
[[redirects]]
  from = "/specialty-materials"
  to = "/specialty-roofing"
  status = 301
[[redirects]]
  from = "/specialty-materials.html"
  to = "/specialty-roofing"
  status = 301
[[redirects]]
  from = "/roof-replacement"
  to = "/asphalt-roofing"
  status = 301
[[redirects]]
  from = "/roof-replacement.html"
  to = "/asphalt-roofing"
  status = 301

# Storm & Insurance was folded into Asphalt Roofing as Roof Inspections
# (Oct 30, 2026). Old storm links land on the Inspections page.
[[redirects]]
  from = "/storm-insurance"
  to = "/roof-inspections"
  status = 301
[[redirects]]
  from = "/storm-insurance.html"
  to = "/roof-inspections"
  status = 301

# The Replacement placeholder was folded into Asphalt Roofing, which is the
# replacement page (Oct 31, 2026).
[[redirects]]
  from = "/asphalt-roof-replacement"
  to = "/asphalt-roofing"
  status = 301
[[redirects]]
  from = "/asphalt-roof-replacement.html"
  to = "/asphalt-roofing"
  status = 301

# About was split into Our Story and Our Team (Oct 30, 2026). Old About
# links, bookmarked or linked from elsewhere, land on Our Story.
[[redirects]]
  from = "/about"
  to = "/our-story"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/our-story"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify Forms: no build step is required. Netlify scans the deployed HTML
# for <form data-netlify="true"> at deploy time and wires up submissions
# automatically. Each lead form has its own name (home, specialty, asphalt,
# contact) so they group separately in the Netlify UI, each with a matching
# hidden "source" field for quick identification in the notification email.
