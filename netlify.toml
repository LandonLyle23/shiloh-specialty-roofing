[build]
  publish = "."

# Canonical host is the non-www apex. Force any www request to redirect
# there so search engines and visitors never see both resolving.
[[redirects]]
  from = "https://www.shilohspecialtyroofing.com/*"
  to = "https://shilohspecialtyroofing.com/:splat"
  status = 301
  force = true

# Specialty Materials -> Specialty Roofing, and Roof Replacement -> Asphalt
# Roofing (page rename). Cover both the clean slug and the .html path in
# case anything bookmarked or linked the old URL either way.
[[redirects]]
  from = "/specialty-materials"
  to = "/specialty-roofing"
  status = 301
[[redirects]]
  from = "/specialty-materials.html"
  to = "/specialty-roofing"
  status = 301
[[redirects]]
  from = "/roof-replacement"
  to = "/asphalt-roofing"
  status = 301
[[redirects]]
  from = "/roof-replacement.html"
  to = "/asphalt-roofing"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify Forms: no build step is required for the forms on this site to
# work. Netlify scans the deployed HTML for <form data-netlify="true"> at
# deploy time and wires up submissions automatically. Each of the seven
# lead forms has its own distinct name (home, specialty, storm,
# storm-guide, asphalt, about, contact) so they group as separate forms
# in the Netlify UI, each carrying a matching hidden "source" field with
# the same value for quick identification inside the notification email.
#
# IMPORTANT: as of the last check, this site's processing_settings has
# ignore_html_forms set to true, which disables Netlify Forms detection
# entirely regardless of how correct this markup is. That has to be
# turned off in Site settings -> Forms (or via the API) before any of
# these forms will actually submit through Netlify.
