<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ss-title ss-desc">
<title id="ss-title">Standing seam panel profile compared to exposed fastener panel</title>
<desc id="ss-desc">Cross-section drawing comparing a mechanically double-locked standing seam metal roof panel with a concealed clip to a lower-cost exposed fastener panel with screws driven through the panel face.</desc>

<!-- divider -->
<line x1="392" y1="30" x2="392" y2="372" class="d-leader"/>

<!-- ===================== LEFT: STANDING SEAM ===================== -->
<text x="20" y="38" class="d-label" font-size="13">STANDING SEAM</text>
<text x="20" y="54" class="d-label-sm">Mechanically double-locked · concealed fastening</text>

<!-- deck -->
<rect x="20" y="348" width="350" height="26" class="d-fill"/>
<line x1="34" y1="352" x2="20" y2="366" class="d-hatch"/>
<line x1="54" y1="352" x2="30" y2="374" class="d-hatch"/>
<line x1="84" y1="352" x2="55" y2="374" class="d-hatch"/>
<line x1="114" y1="352" x2="85" y2="374" class="d-hatch"/>
<line x1="144" y1="352" x2="115" y2="374" class="d-hatch"/>
<line x1="174" y1="352" x2="145" y2="374" class="d-hatch"/>
<line x1="204" y1="352" x2="175" y2="374" class="d-hatch"/>
<line x1="234" y1="352" x2="205" y2="374" class="d-hatch"/>
<line x1="264" y1="352" x2="235" y2="374" class="d-hatch"/>
<line x1="294" y1="352" x2="265" y2="374" class="d-hatch"/>
<line x1="324" y1="352" x2="295" y2="374" class="d-hatch"/>
<line x1="354" y1="352" x2="325" y2="374" class="d-hatch"/>

<!-- underlayment -->
<line x1="20" y1="345" x2="370" y2="345" class="d-line-accent" stroke-dasharray="5 3"/>

<!-- panel pan -->
<rect x="20" y="337" width="350" height="8" class="d-fill"/>

<!-- standing seams (ribs) -->
<path d="M98 337 L98 224 L104 212 L116 212 L122 224 L122 337 Z" class="d-fill"/>
<line x1="103" y1="222" x2="117" y2="222" class="d-line-thin"/>
<path d="M258 337 L258 224 L264 212 L276 212 L282 224 L282 337 Z" class="d-fill"/>
<line x1="263" y1="222" x2="277" y2="222" class="d-line-thin"/>

<!-- concealed clip sliver, tucked under seam at 98-122 -->
<rect x="106" y="330" width="8" height="9" class="d-fill-black"/>

<!-- seam height dimension -->
<line x1="140" y1="337" x2="140" y2="212" class="d-dim"/>
<line x1="134" y1="337" x2="146" y2="337" class="d-dim"/>
<line x1="134" y1="212" x2="146" y2="212" class="d-dim"/>
<text x="148" y="278" class="d-label-dim">1.5–2"</text>
<text x="148" y="290" class="d-label-dim">seam</text>

<!-- leaders + labels -->
<line x1="110" y1="212" x2="110" y2="90" class="d-leader"/>
<line x1="110" y1="90" x2="160" y2="90" class="d-leader"/>
<text x="164" y="94" class="d-label">Double-lock standing seam</text>

<line x1="110" y1="334" x2="70" y2="150" class="d-leader"/>
<line x1="40" y1="150" x2="70" y2="150" class="d-leader"/>
<text x="42" y="146" class="d-label" text-anchor="start">Concealed clip</text>
<text x="42" y="160" class="d-label-sm">fastens to deck —</text>
<text x="42" y="172" class="d-label-sm">panel floats free</text>

<line x1="200" y1="341" x2="200" y2="120" class="d-leader"/>
<line x1="200" y1="120" x2="230" y2="120" class="d-leader"/>
<text x="234" y="116" class="d-label">Panel pan</text>
<text x="234" y="130" class="d-label-sm">24-ga steel or .032" aluminum</text>

<line x1="300" y1="345" x2="330" y2="325" class="d-leader"/>
<text x="234" y="322" class="d-label">Underlayment</text>
<text x="234" y="335" class="d-label-sm">high-temp synthetic</text>

<text x="234" y="370" class="d-label-sm">Solid wood deck</text>

<!-- ===================== RIGHT: EXPOSED FASTENER ===================== -->
<text x="412" y="38" class="d-label" font-size="13">EXPOSED FASTENER</text>
<text x="412" y="54" class="d-label-sm">Through-screwed panel face</text>

<rect x="412" y="348" width="200" height="26" class="d-fill"/>
<line x1="424" y1="352" x2="412" y2="364" class="d-hatch"/>
<line x1="444" y1="352" x2="420" y2="374" class="d-hatch"/>
<line x1="474" y1="352" x2="445" y2="374" class="d-hatch"/>
<line x1="504" y1="352" x2="475" y2="374" class="d-hatch"/>
<line x1="534" y1="352" x2="505" y2="374" class="d-hatch"/>
<line x1="564" y1="352" x2="535" y2="374" class="d-hatch"/>
<line x1="594" y1="352" x2="565" y2="374" class="d-hatch"/>

<path d="M412 337 L436 337 L448 296 L468 296 L480 337 L520 337 L532 296 L552 296 L564 337 L612 337 L612 345 L412 345 Z" class="d-fill"/>

<!-- fasteners at rib crests -->
<circle cx="458" cy="296" r="6" class="d-fill-accent"/>
<line x1="454" y1="296" x2="462" y2="296" class="d-line-thin"/>
<line x1="458" y1="292" x2="458" y2="300" class="d-line-thin"/>
<circle cx="542" cy="296" r="6" class="d-fill-accent"/>
<line x1="538" y1="296" x2="546" y2="296" class="d-line-thin"/>
<line x1="542" y1="292" x2="542" y2="300" class="d-line-thin"/>

<line x1="458" y1="290" x2="458" y2="150" class="d-leader"/>
<line x1="458" y1="150" x2="420" y2="150" class="d-leader"/>
<text x="418" y="120" class="d-label" text-anchor="end">Exposed screw</text>
<text x="418" y="134" class="d-label-sm" text-anchor="end">+ rubber washer</text>
<text x="418" y="167" class="d-label-sm" text-anchor="end">Washer hardens and</text>
<text x="418" y="180" class="d-label-sm" text-anchor="end">cracks over time —</text>
<text x="418" y="193" class="d-label-sm" text-anchor="end">primary leak point</text>

</svg>
